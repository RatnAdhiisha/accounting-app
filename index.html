<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accounting</title>
<meta name="theme-color" content="#1f5f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Accounting">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg:#f6f7f6; --card:#fff; --text:#1b1f1d; --muted:#5f6b66; --accent:#1f5f4a; --line:#dde3e0; --bad:#b3261e; --good:#1f7a4d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111413; --card:#1b201e; --text:#e8eeeb; --muted:#9aa7a1; --accent:#5fbf98; --line:#2c3431; --bad:#f2b8b5; --good:#7fd6a8; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  header { padding:16px 0 8px; }
  h1 { font-size:22px; margin:0; }
  h2 { font-size:16px; margin:0 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:12px 0; }
  label { display:block; font-size:14px; color:var(--muted); margin:10px 0 4px; }
  input { width:100%; font-size:16px; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
  button { font-size:16px; padding:11px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; margin-top:12px; width:100%; }
  .muted { color:var(--muted); font-size:14px; }
  .ok { color:var(--good); } .err { color:var(--bad); }
  ul { margin:4px 0 0; padding-left:18px; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>Accounting</h1>
  <div class="muted">Setup check · version 0.1</div>
</header>

<section class="card">
  <h2>Connect to your data sheet</h2>
  <label for="url">Apps Script link</label>
  <input id="url" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
  <label for="key">Secret key</label>
  <input id="key" type="password" placeholder="The key you set in Apps Script" autocomplete="off">
  <button id="save">Save and test</button>
  <p id="status" class="muted"></p>
</section>

<section id="lists" class="card hidden"></section>

<script src="app.js"></script>
</body>
</html>
